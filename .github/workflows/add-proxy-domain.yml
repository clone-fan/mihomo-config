name: Quick add proxy domains

on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Domains or URLs, separated by spaces, commas, or new lines'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: quick-add-proxy-domains
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Add, validate and publish domains
        shell: pwsh
        env:
          DOMAIN_INPUT: ${{ inputs.domains }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/add-proxy-domain.ps1 -Domain $env:DOMAIN_INPUT -Publish
